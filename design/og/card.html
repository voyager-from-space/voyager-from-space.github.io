<!doctype html><meta charset="utf-8">
<style>
@font-face { font-family: "Plex Sans"; src: url(../../public/fonts/IBMPlexSans-Regular-Latin1.woff2); font-weight: 400; }
@font-face { font-family: "Plex Sans"; src: url(../../public/fonts/IBMPlexSans-SemiBold-Latin1.woff2); font-weight: 600; }
@font-face { font-family: "Plex Mono"; src: url(../../public/fonts/IBMPlexMono-Regular-Latin1.woff2); font-weight: 400; }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; background: #070b16; color: #e8edf6; font-family: "Plex Sans", sans-serif; position: relative; overflow: hidden; }
.dots { position: absolute; inset: 0; background:
  radial-gradient(1.5px 1.5px at 40px 60px, rgb(232 237 246 / .6), transparent 60%),
  radial-gradient(1.5px 1.5px at 280px 180px, rgb(232 237 246 / .4), transparent 60%),
  radial-gradient(2px 2px at 180px 320px, rgb(159 211 238 / .5), transparent 60%),
  radial-gradient(ellipse 60% 70% at 85% 10%, rgb(30 48 92 / .55), transparent 70%);
  background-size: 460px 400px, 620px 520px, 540px 460px, 100% 100%; }
svg.rec { position: absolute; right: -170px; bottom: -190px; width: 640px; height: 640px; }
.brand { position: absolute; left: 80px; top: 64px; display: flex; align-items: center; gap: 14px; font-size: 30px; color: #9ba7bf; }
.name { position: absolute; left: 80px; top: 190px; font-size: 132px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
.job { position: absolute; left: 80px; top: 360px; width: 720px; font-size: 40px; line-height: 1.3; color: #9ba7bf; }
.foot { position: absolute; left: 80px; bottom: 56px; font: 400 26px "Plex Mono", monospace; color: #ffb547; }
.host { position: absolute; left: 80px; bottom: 100px; font-size: 26px; color: #e8edf6; opacity: .0; }
</style>
<div class="dots"></div>
<svg class="rec" viewBox="0 0 400 400" fill="none"><circle cx="200" cy="200" r="190" stroke="#1b2640" stroke-width="2"/><circle cx="200" cy="200" r="160" stroke="#1b2640" stroke-width="1.5"/><circle cx="200" cy="200" r="130" stroke="#223055" stroke-width="1.5"/><circle cx="200" cy="200" r="100" stroke="#2a3a5c" stroke-width="1.5"/><circle cx="200" cy="200" r="70" stroke="#33456b" stroke-width="1.5"/><path d="M200 12a188 188 0 0 1 150 75" stroke="#9fd3ee" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/><circle cx="200" cy="200" r="38" fill="#ffb547"/><circle cx="200" cy="200" r="8" fill="#070b16"/></svg>
<div class="brand"><svg viewBox="0 0 32 32" width="38" height="38"><circle cx="16" cy="16" r="14.5" fill="none" stroke="#9fd3ee" stroke-width="1.5"/><circle cx="16" cy="16" r="10" fill="none" stroke="#9fd3ee" stroke-opacity=".5"/><circle cx="16" cy="16" r="5" fill="#ffb547"/><circle cx="16" cy="16" r="1.3" fill="#070b16"/></svg>voyager</div>
<div class="name" id="nm"></div>
<div class="job" id="jb"></div>
<div class="foot" id="ft"></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("nm").textContent = q.get("name"); document.getElementById("jb").textContent = q.get("job"); document.getElementById("ft").textContent = q.get("foot");
</script>
